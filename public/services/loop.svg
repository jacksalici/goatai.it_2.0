    <radialGradient id="model" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#faf9f5"/><stop offset="0.4" stop-color="#a6b4f3"/><stop offset="1" stop-color="#3a6ea5"/></radialGradient>
